<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#12111f"/>
    </linearGradient>
    <linearGradient id="leftPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="diagonalBridge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="rightPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with border -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>

  <!-- Glowing Geometric 'N' Mark -->
  <g filter="url(#glow)">
    <!-- Left Column (Back/Left prism) -->
    <path d="M34 26 L52 38 L52 102 L34 90 Z" fill="url(#leftPillar)" />
    <!-- Diagonal Bridge (Dynamic Angled Ribbon) -->
    <path d="M34 26 L52 38 L94 102 L76 90 Z" fill="url(#diagonalBridge)" opacity="0.9" />
    <!-- Right Column (Front/Right prism) -->
    <path d="M76 26 L94 38 L94 102 L76 90 Z" fill="url(#rightPillar)" />
    <!-- Glass Highlights / Facet Edges -->
    <path d="M34 26 L52 38 M76 26 L94 38 M34 26 L76 90" stroke="rgba(255,255,255,0.45)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
